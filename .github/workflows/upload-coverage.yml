name: upload-coverage
on:
  workflow_run:
    workflows: [ test-with-coverage ]
    types: [ completed ]

jobs:
  upload-coverage:
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04

    steps:
    - name: Download coverage artifact
      uses: actions/download-artifact@v8
      with:
        name: coverage
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        # download-artifact extracts the named artifact at the workspace root.
        files: coverage.txt
        flags: unittests # optional
        fail_ci_if_error: true
        verbose: true
        # workflow_run uses the default-branch context; override so Codecov
        # attributes the report to the tested PR/push commit instead of master.
        override_commit: ${{ github.event.workflow_run.head_sha }}
        override_branch: ${{ github.event.workflow_run.head_branch }}
        override_pr: ${{ github.event.workflow_run.pull_requests[0].number }}
